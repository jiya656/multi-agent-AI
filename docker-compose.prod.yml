# Production stack. Only Caddy publishes ports; Redis, Qdrant, the API and
# the worker are reachable only inside the private Docker network.
name: multiai-prod   # a separate project, so it never touches the dev stack or its volumes

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      DEBUG_LOGS: "false"
      PORT: "5000"
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    expose:
      - "5000"
    volumes:
      - uploads_data:/app/uploads
      - hf_cache:/app/node_modules/@huggingface/transformers/.cache
    depends_on:
      - redis
      - qdrant
    logging: *default-logging

  worker:
    build:
      context: ./backend
    command: ["node", "worker.js"]
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      DEBUG_LOGS: "false"
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    volumes:
      - uploads_data:/app/uploads
      - hf_cache:/app/node_modules/@huggingface/transformers/.cache
    depends_on:
      - redis
      - qdrant
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - "80"
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    logging: *default-logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    logging: *default-logging

volumes:
  uploads_data:
  hf_cache:
  redis_data:
  qdrant_data:
  caddy_data:
  caddy_config: